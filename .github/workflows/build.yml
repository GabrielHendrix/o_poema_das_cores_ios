name: iOS Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build and Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Remove unsupported flags
        run: |
          # Remove a flag -mno-thumb incompatível com o Clang recente nos arquivos de projeto
          find . -name "*.pbxproj" -exec sed -i '' 's/-mno-thumb//g' {} +

      - name: Build Project
        run: |
          if [ -d "*.xcworkspace" ]; then
            xcodebuild -workspace *.xcworkspace -scheme Unity-iPhone -sdk iphoneos -configuration Release clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -sdk iphoneos -configuration Release clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi

      - name: Archive Project
        run: |
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Unity-iPhone.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          # 1. Cria o ficheiro ExportOptions.plist na raiz da pasta atual
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>D9U5HX986Q</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # 2. Executa a exportação do archive com suporte a atualização de perfis
          xcodebuild -exportArchive \
            -archivePath build/Unity-iPhone.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect / TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/ipa/Unity-iPhone.ipa'
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
