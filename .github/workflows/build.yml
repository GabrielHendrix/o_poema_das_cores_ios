name: iOS Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build and Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
     
      - name: Add Camera Permission to Info.plist
        run: |
          # Garante a permissão de câmera nos Info.plist do projeto
          find . -name "Info.plist" -exec plutil -replace NSCameraUsageDescription -string "Este aplicativo precisa de acesso à câmera para os recursos de realidade aumentada e interação visual." {} +
      
      - name: Remove unsupported flags
        run: |
          find . -name "*.pbxproj" -exec sed -i '' 's/-mno-thumb//g' {} +

      - name: Inject Geo and Vuforia Native Stubs
        run: |
          # Injeta os stubs necessários para -ld_classic e símbolos do Vuforia diretamente no UnityAppController.mm
          TARGET_FILE="Classes/UnityAppController.mm"
          if [ -f "$TARGET_FILE" ]; then
            cat << 'EOF' >> "$TARGET_FILE"

          // MARK: - CI Compatibility Stubs for UnityFramework Linker
          namespace Geo {
              const char* GetiOSAppDocumentsDir() {
                  static char path[1024] = {0};
                  if (path[0] == '\0') {
                      NSArray *paths = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);
                      if ([paths count] > 0) {
                          const char *docPath = [[paths objectAtIndex:0] UTF8String];
                          if (docPath) {
                              strncpy(path, docPath, sizeof(path) - 1);
                          }
                      }
                  }
                  return path;
              }
          }

          extern "C" {
              void arfoundationDriverAddCameraFrameAndPose(void) {}
              void arfoundationDriverAnchorsUpdated(void) {}
              void arfoundationDriverSetCameraMode(int mode) {}
              void arfoundationDriverSetCreateAnchorMethod(void* method) {}
              void arfoundationDriverSetRemoveAnchorMethod(void* method) {}
          }
          EOF
            echo "Stubs injetados com sucesso em $TARGET_FILE"
          else
            echo "Aviso: $TARGET_FILE não encontrado."
          fi

      # Instala o Certificado P12 e o Provisioning Profile no ambiente do CI
      - name: Install Apple Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/PoemaDasCores.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          
      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive" \
            OTHER_LDFLAGS='$(inherited) -Wl,-ld_classic' \
            DEAD_CODE_STRIPPING=NO \
            GCC_STRICT_ALIASING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Verify Archive
        run: ls -ld "$GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive"

      - name: Export IPA
        run: |
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>VJGR937R6K</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.GabrielHendrix.OPoemadasCores</key>
                  <string>PoemaDasCores</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist ExportOptions.plist
            
      - name: Locate and Upload to App Store Connect / TestFlight
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$GITHUB_WORKSPACE/build/ipa" -maxdepth 1 -name "*.ipa" | head -n 1)
          echo "IPA localizado: $IPA_PATH"

          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          echo -n "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D -o "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if [ ! -s "$KEY_FILE" ]; then
            echo "ERRO: O arquivo de chave privada da API está vazio."
            exit 1
          fi

          # Tenta enviar via altool; se descontinuado no Xcode mais recente, usa o xcrun app-store-connect
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
