name: iOS Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build and Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
     
      - name: Add Camera Permission to Info.plist
        run: |
          # Encontra o Info.plist principal do app e adiciona a chave de uso da câmera
          plutil -replace NSCameraUsageDescription -string "Este aplicativo precisa de acesso à câmera para os recursos de realidade aumentada e interação visual." Info.plist
      
      - name: Remove unsupported flags
        run: |
          find . -name "*.pbxproj" -exec sed -i '' 's/-mno-thumb//g' {} +

      # Instala o Certificado P12 e o Provisioning Profile no ambiente do CI
      - name: Install Apple Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/PoemaDasCores.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Descodifica os ficheiros em base64
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D -o "$PP_PATH"

          # Cria e destranca o porta-chaves temporário
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Importa o certificado Apple Distribution
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Define o porta-chaves como prioritário
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Instala o perfil na pasta padrão da Apple
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive Project
        run: |
          # 1. Garante a criação da pasta build antes do archive
          mkdir -p build

          # 2. Executa o archive com caminho absoluto
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # 3. Confirma que o arquivo foi realmente criado
          ls -ld "$GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive"

      - name: Export IPA
        run: |
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>VJGR937R6K</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.GabrielHendrix.OPoemadasCores</key>
                  <string>PoemaDasCores</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Executa o export apontando para o caminho absoluto garantido
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Unity-iPhone.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist ExportOptions.plist
            
      - name: Locate and Upload to App Store Connect / TestFlight
        env:
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$GITHUB_WORKSPACE/build/ipa" -maxdepth 1 -name "*.ipa" | head -n 1)
          echo "IPA localizado: $IPA_PATH"

          # Cria o diretório padrão onde o altool e xcodebuild procuram chaves de autenticação
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE=~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          # Decodifica a chave preservando a integridade das quebras de linha do arquivo .p8
          echo -n "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D -o "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Valida se o arquivo da chave foi criado e possui conteúdo
          if [ ! -s "$KEY_FILE" ]; then
            echo "ERRO: O arquivo de chave privada da API está vazio."
            exit 1
          fi

          # Faz o upload com o altool apontando para a chave instalada
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
